[package]
name = "blazar-web"
description = "Blazar's web UI: Leptos (client-side rendering), built to wasm with Trunk and served by the hub under /v2/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]

pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

blazar-core-types.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true


[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "HtmlElement", "Element", "DomRect", "Node", "NodeList", "KeyboardEvent", "PointerEvent", "MouseEvent", "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlInputElement", "HtmlDetailsElement", "ClipboardEvent", "DragEvent", "DataTransfer", "DataTransferItemList", "DataTransferItem", "File", "FileList", "Blob", "Navigator", "Clipboard", "VisibilityState", "Document", "ScrollIntoViewOptions", "ScrollLogicalPosition"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
