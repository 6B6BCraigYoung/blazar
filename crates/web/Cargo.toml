[package]
name = "blazar-web"
description = "Blazar's web UI: Leptos (client-side rendering), built to wasm with Trunk and served by the hub under /v2/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Markdown 渲染是纯 Rust，原生目标也编，这样 `cargo test` 能直接测它。
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# 只在编到 wasm 时才拉这些依赖：整个工作区 `cargo build` / `cargo test`（原生目标）不会被前端拖慢。
[target.'cfg(target_arch = "wasm32")'.dependencies]
blazar-core-types.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "HtmlElement", "Element", "DomRect", "Node", "NodeList", "KeyboardEvent", "PointerEvent", "MouseEvent", "CssStyleDeclaration"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
