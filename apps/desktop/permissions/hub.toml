[[permission]]
identifier = "hub-mode"
description = "Read and change which hub this desktop app uses."
commands.allow = ["hub_mode", "test_remote_hub", "set_hub_mode", "retry_hub"]

[[permission]]
identifier = "remote-forward"
description = "Forward a preview port the remote hub handed out to this computer."
commands.allow = ["forward_port"]

[[permission]]
identifier = "ui-snapshot"
description = "Capture the visible webview for the UI driver of a dev instance."
commands.allow = ["snapshot_webview"]

[[permission]]
identifier = "local-files"
description = "Show a workspace file of the embedded hub in Finder, and pick a project folder through the native panel."
commands.allow = ["reveal_path", "pick_folder"]

[[permission]]
identifier = "downloads"
description = "Save a workspace file through the native save panel and report its progress."
commands.allow = ["save_download", "cancel_download", "reveal_download"]

[[permission]]
identifier = "clipboard-image"
description = "Put an image from the conversation on the clipboard."
commands.allow = ["copy_image"]
