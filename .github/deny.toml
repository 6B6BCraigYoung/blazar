[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { name = "xxhash-rust", version = "=0.8.19", allow = ["BSL-1.0"] },
    { name = "base16", version = "=0.2.1", allow = ["CC0-1.0"] },
    { name = "webpki-root-certs", version = "=1.0.9", allow = ["CDLA-Permissive-2.0"] },
    { name = "target-lexicon", version = "=0.12.16", allow = ["Apache-2.0 WITH LLVM-exception"] },
]
unused-allowed-license = "warn"
unused-license-exception = "deny"

[licenses.private]
ignore = false

[advisories]
yanked = "deny"
ignore = []
unused-ignored-advisory = "deny"

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
