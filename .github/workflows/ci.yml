name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Workspace version contract
        run: |
          python3 -B scripts/sync_version.py --root . --check
          python3 -B -m unittest discover -s scripts -p "test_sync_version.py" -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked
      - name: Build embedded web assets
        working-directory: crates/web
        run: trunk build --release
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Browser navigation guard
        run: node --test crates/web/tests/navigation.mjs
      - name: Web UI (wasm)
        run: cargo clippy -p blazar-web --target wasm32-unknown-unknown -- -D warnings
